name: ci

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: unit & embedded
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: coursier/cache-action@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Unit and embedded-provider tests (Scala 2.13 and 3)
        run: sbt -batch "+core/test" "+mem/test" "+jcache/test" "+caffeine/test" "+interop/test" "+bench/test"
      - name: Coverage report (Scala 2.13)
        run: sbt -batch coverage "++2.13.18" "core/test" "mem/test" "jcache/test" "caffeine/test" "interop/test" "bench/test" coverageReport
      - uses: actions/upload-artifact@v4
        with:
          name: scoverage-2.13
          path: modules/*/target/scala-2.13/scoverage-report/**
          if-no-files-found: ignore

  e2e:
    name: e2e (compose services)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: coursier/cache-action@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Start backing services
        run: docker compose up -d --wait
      - name: Wait for Hazelcast
        run: bash -c 'until (echo > /dev/tcp/127.0.0.1/5701) > /dev/null 2>&1; do sleep 2; done'
      - name: Wait for Infinispan
        run: bash -c 'until (echo > /dev/tcp/127.0.0.1/11222) > /dev/null 2>&1; do sleep 2; done'
      - name: Initialise Couchbase
        run: ./scripts/couchbase-init.sh
      - name: e2e suites (Scala 2.13 and 3)
        run: sbt -batch "+redis/test" "+hazelcast/test" "+infinispan/test" "+couchbase/test" "+prometheus/test"
      - name: Dump service logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down --volumes --remove-orphans