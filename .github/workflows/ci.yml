name: ci

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core:
    name: ${{ matrix.module }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        module: [core, mem, caffeine, interop, bench]
    steps:
      - uses: actions/checkout@v4
      - uses: coursier/cache-action@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Tests (Scala 2.13 and 3)
        run: sbt -batch "+${{ matrix.module }}/test"

  jcache:
    name: jcache / ${{ matrix.provider }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - provider: caffeine
            suite: JCacheAdapterSuite
          - provider: ehcache
            suite: EhcacheAdapterSuite
          - provider: infinispan
            suite: InfinispanAdapterSuite
          - provider: cache2k
            suite: Cache2kAdapterSuite
    steps:
      - uses: actions/checkout@v4
      - uses: coursier/cache-action@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Contract against the ${{ matrix.provider }} provider
        run: sbt -batch "+jcache/testOnly kots.cache.jcache.${{ matrix.suite }}"

  e2e:
    name: ${{ matrix.provider }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - provider: redis
            module: redis
            service: redis
          - provider: hazelcast
            module: hazelcast
            service: hazelcast
            port: 5701
          - provider: infinispan
            module: infinispan
            service: infinispan
            port: 11222
          - provider: couchbase
            module: couchbase
            service: couchbase
            init: true
          - provider: prometheus
            module: prometheus
            service: prometheus
            port: 9090
    steps:
      - uses: actions/checkout@v4
      - uses: coursier/cache-action@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Start ${{ matrix.service }}
        run: docker compose up -d --wait ${{ matrix.service }}
      - name: Wait for port ${{ matrix.port }}
        if: matrix.port
        run: bash -c 'until (echo > /dev/tcp/127.0.0.1/${{ matrix.port }}) > /dev/null 2>&1; do sleep 2; done'
      - name: Initialise Couchbase
        if: matrix.init
        run: ./scripts/couchbase-init.sh
      - name: Suites (Scala 2.13 and 3)
        run: sbt -batch "+${{ matrix.module }}/test"
      - name: Dump service logs on failure
        if: failure()
        run: docker compose logs --no-color ${{ matrix.service }}
      - name: Tear down
        if: always()
        run: docker compose down --volumes --remove-orphans

  coverage:
    name: coverage (Scala 2.13)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: coursier/cache-action@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Coverage gate
        run: sbt -batch coverage "++2.13.18" "core/test" "mem/test" "jcache/test" "caffeine/test" "interop/test" "bench/test" coverageReport coverageAggregate
      - uses: actions/upload-artifact@v4
        with:
          name: scoverage-2.13
          path: |
            target/scala-2.13/scoverage-report/**
            modules/*/target/scala-2.13/scoverage-report/**
          if-no-files-found: ignore
