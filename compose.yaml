services:
  redis:
    image: docker.io/library/redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15
  hazelcast:
    image: docker.io/hazelcast/hazelcast:5.5
    ports:
      - "5701:5701"
  couchbase:
    image: docker.io/couchbase/server:community-7.6.2
    ports:
      - "8091-8096:8091-8096"
      - "11210:11210"
